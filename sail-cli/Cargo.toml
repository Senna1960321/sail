[package]
name = "sail-cli"
version = "0.24.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "sail"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# musl builds allocate with mimalloc (src/main.rs): musl's mallocng is
# slow under the mux's per-frame allocations. A router build leaves it out
# (scripts/release/build-cli.sh): mallocng holds less memory, which a
# router has least of, and the mux matters less there. MIPS keeps musl's
# either way: 32-bit MIPS lacks the 64-bit atomics libmimalloc's C needs.
mimalloc = ["dep:mimalloc"]
# A measurement build: counts allocations and writes them to the file
# SAIL_ALLOC_STATS names (tools/perf).
alloc-stats = ["sail/alloc-stats"]

[dependencies]
tokio = { version = "1", features = ["rt"] }
argh = "0.1"
serde_json = "1.0"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# With the mimalloc feature, on the targets it builds for.
#
# `sail_measure_mimalloc` is a measurement switch, set in no build that
# ships: with `--cfg sail_measure_mimalloc` in RUSTFLAGS, mimalloc is the
# allocator on the other targets too (Windows, macOS, glibc Linux), to tell
# what the system's allocator costs there (tools/perf/desktop). A cfg and
# not a feature: a feature could not leave this dependency out of the
# default builds for those targets. Without the flag nothing changes.
[target.'cfg(any(all(target_env = "musl", not(any(target_arch = "mips", target_arch = "mips64"))), sail_measure_mimalloc))'.dependencies]
mimalloc = { version = "0.1.52", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sail_measure_mimalloc)'] }

[target.'cfg(not(windows))'.dependencies.sail]
path = "../sail"
default-features = false
features = [
  "default",
  "ctrlc",
  "auto-reload"
]

[target.'cfg(windows)'.dependencies.sail]
path = "../sail"
default-features = false
features = [
  "default",
  "ctrlc",
  "auto-reload",
  "inbound-nf",
  "rule-process-name"
]
