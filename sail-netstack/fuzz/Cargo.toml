[package]
name = "sail-netstack-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sail-netstack = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "wire_parse"
path = "fuzz_targets/wire_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragment_reassembly"
path = "fuzz_targets/fragment_reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_state"
path = "fuzz_targets/tcp_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_table"
path = "fuzz_targets/tcp_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sack_scoreboard"
path = "fuzz_targets/sack_scoreboard.rs"
test = false
doc = false
bench = false

# Keep the fuzz harness independent from Sail's workspace and release graph.
[workspace]

# The workspace's, kept identical by tools/fuzz-check.sh.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "fd5a6885388bb3a05ef4ec14ae1a920a31f0f8b5" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "fd5a6885388bb3a05ef4ec14ae1a920a31f0f8b5" }
# One revision for both; FORK.md there says what each carries.
quinn = { git = "https://github.com/peakpassvpn/quinn.git", rev = "e6762cebec8ceabb52b2ad20f9c7e3fc3893630e" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "e6762cebec8ceabb52b2ad20f9c7e3fc3893630e" }
