[licenses]
confidence-threshold = 0.8
include-dev = true
unused-allowed-license = "warn"
unused-license-exception = "deny"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  # Mozilla/CCADB trust-anchor data embedded by Sail. Its license text ships
  # as THIRD_PARTY_LICENSES.md and is uploaded with every GitHub release.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs@1.0.10" },
  # Cross-platform TUN device implementation. Keep this narrow so a new tun
  # release or another WTFPL dependency requires a fresh review.
  { allow = ["WTFPL"], crate = "tun@0.7.22" },
]

# Exceptions require review and a package/version-specific justification; see
# docs/dependency-security.md.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
  "https://github.com/peakpassvpn/btls.git",
  "https://github.com/peakpassvpn/quinn.git",
  "https://github.com/peakpassvpn/quinn-btls.git",
]

# Advisories allowed, each with its reason; tools/security/check.sh passes
# them to cargo-audit too.
[advisories]
# Include transitive unsound dependencies and reject yanked versions.
unsound = "all"
yanked = "deny"
ignore = [
  # paste, unmaintained, a proc macro used at compile time only. tun-rs's
  # netlink graph (netconfig-rs 0.1.6, route_manager 0.2.16, through
  # netlink-packet-core 0.8). Goes when netconfig-rs releases on
  # netlink-packet-core 0.9 and tun-rs takes it.
  { id = "RUSTSEC-2024-0436", reason = "tun-rs's netlink graph; goes away when netconfig-rs releases on netlink-packet-core 0.9 and tun-rs takes it" },
]
