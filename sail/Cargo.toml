[package]
name = "sail"
version = "0.24.0"
authors = ["eycorsican <eric.y.corsican@gmail.com>"]
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "sail"
path = "src/lib.rs"

[features]
default = [
    "all-endpoints",
    "config-clash",
    "config-surge",
    "rule-set",
    # Rules on the program a connection comes from: regex comes with
    # rule-set already.
    "rule-process-name",
    "outbound-provider",
    "api",
    "clash-api",
    "dns-doh",
    "dns-h3",
]

# Clash / Mihomo YAML configurations.
config-clash = ["serde-saphyr", "indexmap", "fancy-regex", "base64"]
# Surge profiles; they share the Clash front-end's rule-sets and groups.
config-surge = ["config-clash", "base64"]

# Grouping all features
all-endpoints = [
    # inbounds
    "inbound-amux",
    "inbound-quic",
    "inbound-ws",
    "inbound-httpupgrade",
    "inbound-grpc",
    "inbound-tls",
    "inbound-trojan",
    "inbound-mptp",
    "inbound-http",
    "inbound-hc",
    "inbound-shadowsocks",
    "inbound-socks",
    "inbound-tun",
    "inbound-cat",
    "inbound-mixed",
    "inbound-hysteria2",
    "inbound-tuic",
    "inbound-anytls",
    "inbound-shadowtls",
    "inbound-direct",
    "inbound-redirect",
    "inbound-tproxy",
    "inbound-vless",
    "inbound-vmess",
    "inbound-reality",
    # outbounds
    "outbound-direct",
    "outbound-drop",
    "outbound-pass",
    "outbound-redirect",
    "outbound-shadowsocks",
    "outbound-obfs",
    "outbound-socks",
    "outbound-trojan",
    "outbound-tls",
    "outbound-ws",
    "outbound-httpupgrade",
    "outbound-grpc",
    "outbound-amux",
    "outbound-vmess",
    # sing-mux, outbound and served on every inbound
    "mux",
    "outbound-quic",
    "outbound-fallback",
    "outbound-tryall",
    "outbound-vless",
    "outbound-reality",
    "outbound-mptp",
    "outbound-http",
    "outbound-hysteria2",
    "outbound-tuic",
    "outbound-anytls",
    "outbound-shadowtls",
    "outbound-select",
    "outbound-urltest",
    "outbound-load-balance",
    "outbound-smart",
    "outbound-network-group",
    # endpoints
    "wireguard",
]

# BoringSSL, through btls, is the only crypto library: TLS over TCP and
# QUIC, and the AEADs of Shadowsocks and VMess.
aead = ["btls"]
quic = ["tls", "quinn", "quinn-btls"]
tls = ["btls", "btls-sys", "brotli-decompressor", "foreign-types", "miniz_oxide", "ruzstd", "sha2", "webpki-root-certs", "rustls-native-certs"]

# DNS over HTTPS upstreams (`https://`, or `doh:`), on HTTP/2 or HTTP/1.1.
dns-doh = ["tls", "h2", "http", "base64"]
# DNS over HTTP/3 upstreams (`h3://`).
dns-h3 = ["quic", "h3", "h3-quinn", "http", "base64"]

# Router rules
rule-process-name = ["regex"]
# sing-box rule-sets: `route.rule_set`, source and binary.
# The GET that remote rule-sets, outbound providers and fetch download with.
http-client = ["url", "httparse"]
rule-set = ["http-client", "regex", "miniz_oxide", "url", "ruzstd"]
# Outbound providers, a sail extension: group members downloaded as remote
# rule-sets are, and read as Mihomo reads a proxy-provider's.
outbound-provider = ["config-clash", "rule-set"]

# Outbounds
outbound-direct = []
outbound-drop = []
# Mihomo's PASS: a group's pick that hands a connection to the next rule.
# Where every rule and `final` pass, the connection goes direct.
outbound-pass = ["outbound-direct"]
outbound-redirect = []
outbound-shadowsocks = ["aead", "hkdf", "sha-1", "md-5", "percent-encoding", "tokio-util", "blake3", "base64"]
outbound-obfs = ["base64", "memchr"]
outbound-socks = ["async-socks5"]
outbound-trojan = ["sha2", "hex"]
outbound-http = ["base64", "h2", "http"]
outbound-hysteria2 = ["quic", "blake2", "quinn-proto"]
outbound-tuic = ["quic", "tokio/macros"]
outbound-anytls = ["sha2", "md-5", "tokio-util"]
# ShadowTLS v3, the outbound other outbounds detour through.
outbound-shadowtls = ["tls", "hmac", "sha-1", "sha2"]
outbound-tls = ["tls"]
outbound-ws = ["tungstenite", "tokio-tungstenite", "http", "httparse", "base64"]
outbound-httpupgrade = ["http", "httparse"]
outbound-grpc = ["h2", "http"]
outbound-tryall = []
outbound-vless = ["tls"]
outbound-reality = ["tls", "hkdf", "sha2", "hmac", "aes-gcm", "hex", "base64"]
outbound-amux= ["tokio-util"]
outbound-quic = ["quic"]
outbound-mptp = []
# The API's select routes read their query string; without the API, the
# selector needs nothing more.
outbound-select = ["axum?/query"]
# Exposes its selection and latencies the way a selector does.
outbound-urltest = ["outbound-select"]
outbound-load-balance = ["lru_time_cache"]
# load-balance's consistent hashing by the public suffix list, instead of
# an approximation of it. The list, compiled in, adds about 900 KB to a
# release binary, so it is left out by default.
load-balance-psl = ["outbound-load-balance", "psl"]
# Scores its members by the connections through them and keeps a site on
# one; exposes its selection and scores the way a selector does.
outbound-smart = ["outbound-select", "lru_time_cache", "fancy-regex", "sha2"]
# Exposes its selection and latencies the way a selector does.
outbound-fallback = ["outbound-select"]
# Picks its member by the network the host is on; exposes it the way a
# selector does.
outbound-network-group = ["outbound-select"]
outbound-vmess = ["aead", "hmac", "sha2", "aes", "sha3", "md-5", "crc32fast"]

# Inbounds
inbound-trojan = ["sha2", "hex"]
inbound-vless = ["tls"]
inbound-vmess = ["aead", "hmac", "sha2", "aes", "sha3", "md-5", "crc32fast"]
inbound-mixed = ["inbound-http", "inbound-socks"]
inbound-hysteria2 = ["quic", "blake2", "quinn-proto", "url", "h2", "http"]
inbound-tuic = ["quic", "tokio/macros"]
inbound-anytls = ["sha2", "md-5", "tokio-util"]
# ShadowTLS v3, handing its connections to the inbound its detour names.
inbound-shadowtls = ["hmac", "sha-1", "sha2"]
inbound-mptp = []
inbound-shadowsocks = ["aead", "hkdf", "sha-1", "md-5", "tokio-util", "blake3", "base64"]
inbound-socks = []
inbound-http = ["http", "base64", "h2"]
inbound-hc = []
inbound-tun = ["tun", "netstack", "dep:tun-rs", "pnet_datalink"]
# The userspace TCP/IP stack, for the TUN inbound and for outbounds that
# carry IP packets.
netstack = ["dep:sail-netstack"]
inbound-ws = ["tungstenite", "tokio-tungstenite", "http", "httparse", "base64"]
inbound-httpupgrade = ["http", "httparse", "tungstenite/handshake"]
inbound-grpc = ["h2", "http"]
inbound-amux = ["tokio-util"]
inbound-quic = ["quic"]
inbound-tls = ["tls"]
inbound-reality = ["tls", "hkdf", "sha2", "hmac", "aes-gcm", "hex", "base64"]
inbound-cat = ["tokio/io-std"]
inbound-nf = ["libloading"]
inbound-direct = []
inbound-redirect = []
inbound-tproxy = []

# WireGuard: the protocol, and its endpoint over the userspace stack.
wireguard = ["netstack", "btls", "btls-sys", "blake2", "base64"]

# sing-box's multiplex (sing-mux): smux, yamux, and h2mux over HTTP/2.
mux = ["h2", "http"]
# sail::muxcore, for a host's own links: yamux sessions over any
# connection (docs/embed.md).
muxcore = []

plugin = ["async-ffi", "libloading"]
api = ["axum", "hyper-util"]
# The Clash API, which dashboards (yacd, metacubexd) control an instance through.
clash-api = ["axum", "axum/ws", "axum/query", "hyper-util", "miniz_oxide"]
auto-reload = ["notify"]
# Counts allocations, for the measurement builds of the performance
# regression checks; never in a released build.
alloc-stats = []
ctrlc = ["tokio/signal"]
# Pure in-memory parser entry points used only by the separate cargo-fuzz
# workspace. Keep this out of default builds and runtime APIs.
fuzzing = ["rule-set", "tokio/test-util"]
# Panics a test arms (sail::fault), to see what a failing instance
# leaves in the system. Never in a build that ships: CI fails a release
# workflow or cross script that names it.
fault-injection = []

[dependencies]
# Common
tokio = { version = "1", features = ["sync", "io-util", "net", "time", "rt", "rt-multi-thread", "macros"] }
protobuf = "3.7.2"
# sing-box's cache_file: selections, the Clash mode and fake IPs kept across restarts.
redb = "4.3"
thiserror = "1.0"
futures = "0.3"
async-trait = "0.1"
bytes = "1"
lazy_static = "1.5"
anyhow = "1.0"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
async-recursion = "1.1"
arc-swap = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

# DNS
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
lru = "0.18.2"
# 64-bit atomics where the target has none (32-bit mips); the native
# ones elsewhere.
portable-atomic = "1"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
chrono = "0.4"

# Router
maxminddb = "0.27"
memmap2 = "0.9"
cidr = "0.2"
regex = { version = "1.11", optional = true }

# plugin
async-ffi = { version = "0.2", optional = true }
libloading = { version = "0.7", optional = true }

# config
serde_json = { version = "1.0", features = ["raw_value"] }
serde_derive = "1.0"
serde = "1.0"
serde_path_to_error = "0.1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"], optional = true }
indexmap = { version = "2", features = ["serde"], optional = true }
fancy-regex = { version = "0.14", optional = true }

# TLS
btls = { version = "0.5.6", optional = true }
btls-sys = { version = "0.5.6", optional = true }
brotli-decompressor = { version = "5", optional = true }
miniz_oxide = { version = "0.8", optional = true }
ruzstd = { version = "0.9.1", optional = true }
foreign-types = { version = "0.5", optional = true }
webpki-root-certs = { version = "1", optional = true }
# The system's root certificates: certificate.store "system".
rustls-native-certs = { version = "0.8", optional = true }

# WebSocket
tungstenite = { version = "0.24", default-features = false, optional = true }
tokio-tungstenite = { version = "0.24", optional = true }

# WebSocket, HTTPUpgrade, gRPC; h2 also for sing-mux h2mux
url = { version = "2.5", optional = true }
http = { version = "1.1", optional = true }
httparse = { version = "1.9", optional = true }
h2 = { version = "0.4", optional = true }

# SOCKS outbound
async-socks5 = { version = "0.6", optional = true }

# Shadowsocks
hkdf = { version = "0.12", optional = true }
md-5 = { version = "0.10", optional = true }
sha-1 = { version = "0.10", optional = true }
percent-encoding = { version = "2.3", optional = true }

# Obfs
base64 = { version = "0.22", optional = true }
blake3 = { version = "1", optional = true }
memchr = { version = "2", optional = true }

# Trojan
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

# VMess
hmac = { version = "0.12", optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
crc32fast = { version = "1", optional = true }

# load-balance: sticky sessions; smart: sites
lru_time_cache = { version = "0.11", optional = true }
# load-balance: consistent hashing by registrable domain, from the public
# suffix list compiled in
psl = { version = "2", optional = true }

# amux
tokio-util = { version = "0.7", default-features = false, features = ["io", "codec", "compat"], optional = true }

# QUIC
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn-btls = { git = "https://github.com/peakpassvpn/quinn-btls.git", rev = "e57c89ddb9e3e661b1226977764bc299226b8472", default-features = false, optional = true }

# Hysteria2: Salamander obfuscation, and the congestion controller trait
blake2 = { version = "0.10", optional = true }
quinn-proto = { version = "0.11", default-features = false, optional = true }


# API
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"], optional = true }
# The management API serves its router on a unix socket too, which axum 0.7
# does not: the connection server axum serves with, the same version.
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "server", "service", "http1"], optional = true }

# Auto reload
notify = { version = "6", optional = true }

# TUN
tun = { version = "0.7", features = ["async"], optional = true  }
sail-netstack = { path = "../sail-netstack", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Multi-queue TUN with GSO/GRO offload for the TUN inbound.
tun-rs = { version = "2.8.11", features = ["async"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# The network the host is on (IP Helper's adapters, the WLAN service),
# route management through IP Helper and the firewall (WFP), and the TUN
# through wintun, as sing-tun does it.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
wintun-bindings = "0.7"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
pnet_datalink = { version = "0.34", package = "pnet_datalink", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rcgen = "0.13"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "sync", "io-util", "net", "time", "rt", "rt-multi-thread", "test-util"] }

[build-dependencies]
cc = "1.2"
protobuf-codegen = "=3.7.2"
protoc-bin-vendored = "3.2"
