[workspace]
members = [
    "sail",
    "sail-cli",
    "sail-ffi",
    "sail-netstack",
    "sail-plugins/shadowsocks",
]
default-members = ["sail-cli"]
resolver = "2"

# sail's forks, each with a FORK.md on its `sail` branch: btls with the
# REALITY and ECH GREASE hooks, the Apple deployment target and the SslRef
# handshake-side setters; quinn-proto with the scattered ClientHello.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "132da2caff5d94c0f9ea52aa82bbc170bf2baaa6" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "132da2caff5d94c0f9ea52aa82bbc170bf2baaa6" }
# One revision for both; FORK.md there says what each carries.
quinn = { git = "https://github.com/peakpassvpn/quinn.git", rev = "c97ac77afac2a2ea82c389313dfaa7768abf7d17" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "c97ac77afac2a2ea82c389313dfaa7768abf7d17" }

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1
panic = "abort"
strip = "symbols"

# What a release ships: release, with line tables kept so that
# scripts/release/split-symbols.sh can move them out of the shipped file
# into one of their own, matched to it by build ID.
[profile.dist]
inherits = "release"
debug = "line-tables-only"
strip = false

# BoringSSL at -O3, as in release. cmake-rs takes CMake's build type from
# btls-sys's settings: opt-level 3 with debug info is RelWithDebInfo, -O2;
# without, Release, -O3. BoringSSL adds -ggdb itself either way (not with
# MSVC), so its frames keep their symbols and lines. dist-router's
# opt-level "z" stays MinSizeRel, -Os. With MSVC BoringSSL's frames have no
# debug info; when Windows crash reports want them, set
# CMAKE_C_FLAGS_RELEASE / CMAKE_CXX_FLAGS_RELEASE to add /Zi for btls-sys.
[profile.dist.package.btls-sys]
debug = false

# The mobile libraries, the XCFramework and the AAR: dist, unwinding on a
# panic. In them a panic in sail is caught as docs/embed.md says (a task's
# ends that task alone, an essential one fails the instance, what it changed
# in the system is undone) and the app or the network extension lives on;
# sail-cli, the routers' packages and the other dist builds still abort.
# Decided 2026-10-04.
[profile.dist-mobile]
inherits = "dist"
panic = "unwind"
# Thin LTO in one codegen unit, not dist's fat LTO in 16. Measured
# 2026-10-06 on Android arm64 (stripped libsail_jni.so, sail-ffi's LTO and
# link alone): 26.9 MB in 185 s against 28.7 MB in 282 s, its peak build
# memory 6.0 GB against 8.3; throughput and CPU per GiB the same within
# 5%. The Apple slices' time and size are measured at the next release.
lto = "thin"
codegen-units = 1

[profile.dist-mobile.package.btls-sys]
debug = false

# A router's build: every feature, smaller for its flash. Measured on
# armv7 musl: 19.1 MB at dist, about 11 MB here; forwarding CPU on x86_64
# within the judged limit (-2 to +6% per GiB for direct, ss and trojan).
# Its allocator, musl's, is chosen by build-cli.sh, not here.
[profile.dist-router]
inherits = "dist"
opt-level = "z"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
